name: Java CI

on:
  push:
    branches: [ main, feature/*, bugfix/*, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build-module02:
    name: Build Module 02 with Java 17
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./module02
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify

  build-module03:
    name: Build Module 03 with Java 8
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./module03/spring-pet-clinic
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify

  build-ptip-aggregate:
    name: Build PTIP Aggregate Service with Java 17
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./module03/ptip-aggregate-svc
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify
